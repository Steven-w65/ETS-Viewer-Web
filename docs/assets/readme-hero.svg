      <rect x="803" y="73" width="343" height="257" rx="18" fill="url(#page)" stroke="#58705C" />
      <rect x="827" y="98" width="36" height="28" rx="7" fill="#36503E" />
      <text x="836" y="117" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#D1E0D1">
        Q1
      </text>
      <path d="M878 107h116M878 119h81" stroke="#6D8973" stroke-width="4" stroke-linecap="round" />
      <path
        d="m1108 110 4 4 4-4"
        stroke="#9CB09E"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <path
        d="M827 148h204M827 166h157"
        stroke="#849D88"
        stroke-opacity=".6"
        stroke-width="5"
        stroke-linecap="round"
      />
      <rect
        x="825"
        y="194"
        width="298"
        height="112"
        rx="11"
        fill="url(#answer)"
        stroke="#64826A"
        stroke-opacity=".55"
      />
      <path
        d="m842 216 4 4 7-8"
        stroke="#BCD7BA"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <text
        x="863"
        y="221"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="10"
        font-weight="600"
        letter-spacing="1.6"
        fill="#C3D9BF"
      >
        REFERENCE ANSWER
      </text>
      <path
        d="M843 247h230M843 264h192M843 281h131"
        stroke="#C6D8C5"
        stroke-opacity=".7"
        stroke-width="5"
        stroke-linecap="round"
      />
    </g>
    <g>
      <circle cx="1134" cy="309" r="35" fill="#B4CEB8" />
      <circle cx="1134" cy="309" r="43" stroke="#8FAD94" stroke-opacity=".2" />
      <path
        d="m1119 309 10 10 19-21"
        stroke="#253E2C"
        stroke-width="3.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </g>
    <rect x=".5" y=".5" width="1279" height="399" rx="19.5" stroke="#829B88" stroke-opacity=".16" />
  </g>
