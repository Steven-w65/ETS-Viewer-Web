        y="46"
        width="278"
        height="270"
        rx="18"
        fill="#1D2D26"
        stroke="#49604E"
        stroke-opacity=".75"
      />
      <path d="M912 80h73M912 98h132" stroke="#5A7563" stroke-width="5" stroke-linecap="round" />
    </g>
    <g transform="rotate(-5 977 200)">
      <rect
        x="803"
        y="79"
        width="343"
        height="257"
        rx="18"
        fill="#0D1512"
